[workspace]
resolver = "3"
members = [
    "cliva",
    "cliva-io",
    "cliva-macros", "cliva-runtime",
    "cliva-tree",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theNexmentProject/cliva"
homepage = "https://app.nexment.in/projects/cliva"
readme = "README.md"
keywords = ["cli", "command-line", "terminal", "rust"]
categories = ["command-line-interface", "command-line-utilities"]

